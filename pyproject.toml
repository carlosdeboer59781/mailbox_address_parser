[project]
name = "mailbox-address-parser"
version = "0.1.1"
description = "Parses RFC 5322 mailbox address specifications, handling display names, quoted strings, and comments."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
